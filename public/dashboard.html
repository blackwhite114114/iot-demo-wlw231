<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT 温湿度监控面板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 24px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  h1 { font-size: 20px; font-weight: 600; }
  #status {
    font-size: 13px;
    padding: 4px 12px;
    border-radius: 999px;
    background: #334155;
  }
  #status.online { background: #14532d; color: #86efac; }
  #status.offline { background: #7f1d1d; color: #fca5a5; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
  }
  .card .label { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
  .card .value { font-size: 36px; font-weight: 700; }
  .card .unit { font-size: 16px; color: #94a3b8; margin-left: 4px; }
  .card.temp .value { color: #fb923c; }
  .card.humi .value { color: #38bdf8; }
  .card .meta { font-size: 12px; color: #64748b; margin-top: 8px; }
  .chart-box {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    height: 420px;
  }
</style>
</head>
<body>
  <header>
    <h1>📡 sensor-001 温湿度实时监控</h1>
    <span id="status" class="offline">未连接</span>
  </header>

  <div class="cards">
    <div class="card temp">
      <div class="label">当前温度</div>
      <div><span class="value" id="tempValue">--</span><span class="unit">℃</span></div>
      <div class="meta" id="tempTime">等待数据…</div>
    </div>
    <div class="card humi">
      <div class="label">当前湿度</div>
      <div><span class="value" id="humiValue">--</span><span class="unit">%</span></div>
      <div class="meta" id="humiTime">等待数据…</div>
    </div>
  </div>

  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>

<script>
  const MAX_POINTS = 120;
  const statusEl = document.getElementById('status');

  const chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        {
          label: '温度 (℃)',
          data: [],
          borderColor: '#fb923c',
          backgroundColor: 'rgba(251, 146, 60, 0.15)',
          yAxisID: 'yTemp',
          tension: 0.3,
          pointRadius: 0,
          fill: true,
        },
        {
          label: '湿度 (%)',
          data: [],
          borderColor: '#38bdf8',
          backgroundColor: 'rgba(56, 189, 248, 0.15)',
          yAxisID: 'yHumi',
          tension: 0.3,
          pointRadius: 0,
          fill: true,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { ticks: { color: '#94a3b8', maxTicksLimit: 10 }, grid: { color: '#334155' } },
        yTemp: {
          position: 'left',
          title: { display: true, text: '℃', color: '#fb923c' },
          ticks: { color: '#fb923c' },
          grid: { color: '#334155' },
        },
        yHumi: {
          position: 'right',
          title: { display: true, text: '%', color: '#38bdf8' },
          ticks: { color: '#38bdf8' },
          grid: { drawOnChartArea: false },
        },
      },
      plugins: { legend: { labels: { color: '#e2e8f0' } } },
    },
  });

  function fmtTime(ts) {
    return new Date(ts).toLocaleTimeString('zh-CN', { hour12: false });
  }

  function addPoint(d) {
    chart.data.labels.push(fmtTime(d.ts));
    chart.data.datasets[0].data.push(d.temperature);
    chart.data.datasets[1].data.push(d.humidity);
    if (chart.data.labels.length > MAX_POINTS) {
      chart.data.labels.shift();
      chart.data.datasets.forEach((ds) => ds.data.shift());
    }
    chart.update('none');

    const t = fmtTime(d.ts);
    document.getElementById('tempValue').textContent = d.temperature;
    document.getElementById('humiValue').textContent = d.humidity;
    document.getElementById('tempTime').textContent = '更新于 ' + t;
    document.getElementById('humiTime').textContent = '更新于 ' + t;
  }

  // 初始化：拉取历史数据
  fetch('/api/history')
    .then((r) => r.json())
    .then((list) => list.forEach(addPoint))
    .catch(() => {});

  // SSE 实时推送
  const es = new EventSource('/api/stream');
  es.onopen = () => {
    statusEl.textContent = '已连接';
    statusEl.className = 'online';
  };
  es.onmessage = (e) => addPoint(JSON.parse(e.data));
  es.onerror = () => {
    statusEl.textContent = '连接断开，重连中…';
    statusEl.className = 'offline';
  };
</script>
</body>
</html>
